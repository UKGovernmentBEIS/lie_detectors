[project]
name = "lie-detectors"
version = "0.1.0"
description = "Load pre-trained lie-detection probes from the AI Safety Institute HuggingFace collection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["deception-detection", "lie-detection", "probe", "interpretability"]
dependencies = [
    "torch>=2.1",
    "huggingface-hub>=0.20",
    "pydantic>=2",
    "jaxtyping>=0.2",
]

[project.urls]
Homepage = "https://github.com/UKGovernmentBEIS/lie_detectors"
Collection = "https://huggingface.co/collections/ai-safety-institute/lie-detection"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lie_detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network access to download a probe from HuggingFace",
]

[tool.ruff.lint]
# jaxtyping shape annotations (e.g. Float[Tensor, "*batch d_model"]) are not valid Python
# forward-reference syntax, which ruff would otherwise flag.
ignore = ["F722"]
